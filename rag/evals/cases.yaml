- id: taobao_pv_1125
  db: taobao
  question: "2017 年 11 月 25 日淘宝的 PV 是多少"
  expected_sql: "SELECT SUM(is_pv) FROM taobao.taobao_user_behavior_wide WHERE behavior_date='2017-11-25'"
  expected_value: 9353423
