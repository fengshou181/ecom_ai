# RAG 评测用例集（30 条，每库 6 题，三档难度：单表聚合 / 多条件过滤 / 分组排序 TOP-N）
# expected_value：与结果首行最后一列做相对误差比较（tolerance）
# expected_text：与结果首行第一列做大小写不敏感子串匹配
# 基准值全部由 scripts 标准 SQL 在 Doris 实测获得（2026-10-17）

# ========== olist ==========
- id: olist_gmv_delivered
  db: olist
  question: "olist 平台已交付订单的商品金额合计是多少"
  expected_sql: "SELECT SUM(price) FROM olist.olist_order_item_wide WHERE order_status='delivered'"
  expected_value: 13221498.11
  tolerance: 0.01
  tags: [aggregation, gmv]

- id: olist_order_cnt
  db: olist
  question: "olist 一共有多少个订单"
  expected_sql: "SELECT COUNT(DISTINCT order_id) FROM olist.olist_order_item_wide"
  expected_value: 98667
  tolerance: 0
  tags: [aggregation, count]

- id: olist_2017_delivered_orders
  db: olist
  question: "2017 年 olist 已交付的订单有多少个"
  expected_sql: "SELECT COUNT(DISTINCT order_id) FROM olist.olist_order_item_wide WHERE order_status='delivered' AND YEAR(order_purchase_timestamp)=2017"
  expected_value: 43428
  tolerance: 0
  tags: [filter, time, count]

- id: olist_avg_delivery_days
  db: olist
  question: "olist 已交付订单的平均配送天数是多少"
  expected_sql: "SELECT AVG(delivery_days) FROM olist.olist_order_item_wide WHERE order_status='delivered'"
  expected_value: 9.14
  tolerance: 0.02
  tags: [filter, avg]

- id: olist_top_category_sales
  db: olist
  question: "olist 销售额最高的商品类目是哪个"
  expected_sql: "SELECT product_category_name_english, SUM(price) AS s FROM olist.olist_order_item_wide WHERE order_status='delivered' GROUP BY product_category_name_english ORDER BY s DESC LIMIT 1"
  expected_text: "health_beauty"
  tags: [topn, groupby]

- id: olist_top_state_orders
  db: olist
  question: "olist 订单数最多的州是哪个"
  expected_sql: "SELECT customer_state, COUNT(DISTINCT order_id) AS c FROM olist.olist_order_item_wide GROUP BY customer_state ORDER BY c DESC LIMIT 1"
  expected_text: "SP"
  tags: [topn, groupby]

# ========== amazon ==========
- id: amazon_review_cnt
  db: amazon
  question: "amazon 数据集一共有多少条评论"
  expected_sql: "SELECT COUNT(*) FROM amazon.amazon_review_wide"
  expected_value: 409961
  tolerance: 0.0001
  tags: [aggregation, count]

- id: amazon_five_star_ratio
  db: amazon
  question: "amazon 评论的 5 星占比是多少"
  expected_sql: "SELECT SUM(CASE WHEN score=5 THEN 1 ELSE 0 END)/COUNT(*) FROM amazon.amazon_review_wide"
  expected_value: 0.6377
  tolerance: 0.01
  tags: [aggregation, ratio]

- id: amazon_avg_score
  db: amazon
  question: "amazon 评论的平均评分是多少"
  expected_sql: "SELECT AVG(score) FROM amazon.amazon_review_wide WHERE score IS NOT NULL"
  expected_value: 4.1665
  tolerance: 0.01
  tags: [filter, avg]

- id: amazon_avg_price_priced
  db: amazon
  question: "amazon 价格大于 0 的商品平均价格是多少"
  expected_sql: "SELECT AVG(price) FROM amazon.amazon_review_wide WHERE price > 0"
  expected_value: 25.23
  tolerance: 0.02
  tags: [filter, avg]

- id: amazon_top_category_reviews
  db: amazon
  question: "amazon 评论数最多的非空类目是哪个"
  expected_sql: "SELECT category_name, COUNT(*) AS c FROM amazon.amazon_review_wide GROUP BY category_name ORDER BY c DESC LIMIT 1"
  expected_text: "Kitchen"
  tags: [topn, groupby]

- id: amazon_best_category_score
  db: amazon
  question: "amazon 评论数超过 100 的类目中，平均评分最高的类目是哪个"
  expected_sql: "SELECT category_name, AVG(score) AS a FROM amazon.amazon_review_wide GROUP BY category_name HAVING COUNT(*)>100 ORDER BY a DESC LIMIT 1"
  expected_text: "Home Appliances"
  tags: [topn, groupby, having]

