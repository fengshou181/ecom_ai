- id: taobao_top_buy_date
  db: taobao
  question: "淘宝购买量最高的是哪一天"
  expected_sql: "SELECT behavior_date, SUM(is_buy) AS b FROM taobao.taobao_user_behavior_wide GROUP BY behavior_date ORDER BY b DESC LIMIT 1"
  expected_text: "2017-12-02"
  tags: [topn, groupby, time]

# ========== product_samples ==========
# 注：jd_products 为爬虫小样本（25 行），price/shop/comments 列因 CSV 字段错位基本为空，
# 用例围绕实际可查的 name/url 字段设计，同时覆盖数据质量认知。
- id: jd_product_cnt
  db: product_samples
  question: "product_samples 里有多少条商品样本"
  expected_sql: "SELECT COUNT(*) FROM product_samples.jd_products"
  expected_value: 25
  tolerance: 0
  tags: [aggregation, count]

- id: jd_name_not_null
  db: product_samples
  question: "京东商品样本中有商品名称的记录有多少条"
  expected_sql: "SELECT COUNT(*) FROM product_samples.jd_products WHERE name IS NOT NULL AND name != ''"
  expected_value: 25
  tolerance: 0
  tags: [aggregation, count]

- id: jd_name_bluetooth
  db: product_samples
  question: "京东商品样本中名称包含蓝牙的商品有多少个"
  expected_sql: "SELECT COUNT(*) FROM product_samples.jd_products WHERE name LIKE '%蓝牙%'"
  expected_value: 12
  tolerance: 0
  tags: [filter, like]

- id: jd_name_earphone
  db: product_samples
  question: "京东商品样本中名称包含耳机的商品有多少个"
  expected_sql: "SELECT COUNT(*) FROM product_samples.jd_products WHERE name LIKE '%耳机%'"
  expected_value: 14
  tolerance: 0
  tags: [filter, like]

- id: jd_name_flagship
  db: product_samples
  question: "京东商品样本中名称包含旗舰店的记录有多少条"
  expected_sql: "SELECT COUNT(*) FROM product_samples.jd_products WHERE name LIKE '%旗舰店%'"
  expected_value: 4
  tolerance: 0
  tags: [filter, like]

- id: jd_max_name_len
  db: product_samples
  question: "京东商品样本中最长的商品名称有多少个字符"
  expected_sql: "SELECT MAX(CHAR_LENGTH(name)) FROM product_samples.jd_products"
  expected_value: 96
  tolerance: 0
  tags: [topn, max]
